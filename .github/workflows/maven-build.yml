name: Maven Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: VotingPluginEditor

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: VotingPluginEditor/pom.xml

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload packaged JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VotingPluginEditor-${{ github.sha }}
          path: VotingPluginEditor/target/*.jar
          if-no-files-found: error
          retention-days: 14
