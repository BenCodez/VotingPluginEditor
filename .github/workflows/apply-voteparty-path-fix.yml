name: Apply VoteParty path fix

on:
  push:
    branches:
      - agent/fix-voteparty-reminder-paths

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-voteparty-reminder-paths
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update VoteParty reminder paths
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('VotingPluginEditor/src/main/java/com/bencodez/votingplugineditor/files/SpecialRewardsConfig.java')
          text = path.read_text()
          replacements = {
              'VoteParty.VoteReminderBroadcast': 'VoteParty.VoteReminder.Broadcast',
              'VoteParty.VoteReminderAtVotes': 'VoteParty.VoteReminder.Votes',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected path: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-voteparty-path-fix.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VotingPluginEditor/src/main/java/com/bencodez/votingplugineditor/files/SpecialRewardsConfig.java .github/workflows/apply-voteparty-path-fix.yml
          git commit -m "Fix VoteParty reminder config paths"
          git push
